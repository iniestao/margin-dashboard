name: 每日数据更新

on:
  schedule:
    # 每天北京时间 02:10 和 07:55 = UTC 18:10 / 23:55（前一日）
    # 凌晨即可取到上一交易日全部数据；周末/节假日自动跳过非交易日
    - cron: "10 18 * * *"
    - cron: "55 23 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发（首次部署用）

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 同步远程最新代码（确保本地与远程一致）
        run: |
          git config user.name "iniestao"
          git config user.email "iniestao@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: 更新数据（增量追加）
        run: python cloud_update.py
        env:
          LOOKBACK_DAYS: "100"

      - name: 提交数据回仓库
        run: |
          git add data
          git diff --quiet && git diff --cached --quiet || git commit -m "chore(data): 每日融资数据更新 $(date -u +%Y-%m-%d)"
          git push
