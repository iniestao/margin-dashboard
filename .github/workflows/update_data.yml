name: 每日数据更新

on:
  schedule:
    # 北京时间 18:30（A股收盘后），周一至周五 = UTC 10:30
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发（首次部署用）

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 更新数据
        run: python cloud_update.py
        env:
          LOOKBACK_DAYS: "45"

      - name: 提交数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --quiet && git diff --cached --quiet || git commit -m "chore(data): 每日融资数据更新 $(date -u +%Y-%m-%d)"
          git push
