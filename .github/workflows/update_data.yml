name: 每日数据更新

on:
  schedule:
    # 每天北京时间 02:10 和 06:10 = UTC 18:10 / 22:10
    # 凌晨即可取到上一交易日全部数据；周末/节假日自动跳过非交易日
    - cron: "10 18 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发（首次部署用）

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # 兜底：正常 25-40 分钟，超时强制结束，防跑批无限挂起（曾挂 3 小时）
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 同步远程最新代码（确保本地与远程一致）
        run: |
          git config user.name "iniestao"
          git config user.email "iniestao@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: 更新数据（增量追加）
        # -u：stdout 不缓冲。原来输出被块缓冲、全部在最后一刻刷出，
        # 日志里所有行时间戳相同，无法判断哪一步耗时/何时开始失败（2026-09-24 排查受阻）
        run: python -u cloud_update.py
        env:
          LOOKBACK_DAYS: "100"
          PYTHONUNBUFFERED: "1"

      - name: 提交数据回仓库
        # always()：上面的更新步骤在"数据仍残缺"时会以退出码 1 结束（故意让跑批变红），
        # 此时仍要把已拉到的数据提交上去，否则半残状态会被整体丢弃
        if: always()
        run: |
          git add data
          git diff --quiet && git diff --cached --quiet || git commit -m "chore(data): 每日融资数据更新 $(date -u +%Y-%m-%d)"
          git push
